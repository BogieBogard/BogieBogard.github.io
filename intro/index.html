<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matthew Bogard | Intro</title>
    <meta name="description" content="A short video intro from Matthew Bogard, Senior Full Stack Engineer.">
    <meta name="author" content="Matthew Bogard">
    <meta name="theme-color" content="#0a0a0b">

    <!-- Link previews -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mbogard.com/intro/">
    <meta property="og:title" content="Matthew Bogard, Senior Full Stack Engineer">
    <meta property="og:description" content="A short video intro, 1:26.">
    <meta property="og:image" content="https://mbogard.com/intro/assets/headshot.jpg">
    <meta name="twitter:card" content="summary">

    <!-- Favicons (same MB mark as the rest of the site) -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400&display=swap">

    <link rel="preload" as="image" href="/intro/assets/headshot.jpg">

    <style>
        :root {
            --bg: #0a0a0b;
            --frame: #050506;
            --text: #ffffff;
            --muted: #9a9a9a;
            --quiet: #7d7d7d;
            --line: rgba(255, 255, 255, 0.16);
            --accent: #0b90ef;
            --pip-border: #d4d7dc;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(24px, 5vh, 56px) 32px;
        }

        /* Name and title, in the portfolio's letter-spaced style */
        .intro-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .name {
            margin: 0 -0.42em 0 0;
            font-weight: 700;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: 0.42em;
            text-transform: uppercase;
        }

        .role {
            margin: 0 -0.26em 0 0;
            font-weight: 500;
            font-size: 11px;
            line-height: 1.4;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Player: sized so the whole 16:9 frame fits above the fold on a laptop */
        .player {
            position: relative;
            margin-top: 34px;
            width: min(1040px, 100%, max(480px, calc((100vh - 320px) * 16 / 9)));
            width: min(1040px, 100%, max(480px, calc((100svh - 320px) * 16 / 9)));
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            overflow: hidden;
            background: var(--frame);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 40px 90px rgba(0, 0, 0, 0.55);
            container-type: inline-size;
        }

        .player video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: var(--frame);
        }

        .player video:focus {
            outline: none;
        }

        /* Poster: the headshot sits exactly where the webcam window appears in the video */
        .poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: var(--frame);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .poster[hidden] {
            display: none;
        }

        .poster:focus-visible {
            outline: none;
        }

        .poster:focus-visible .disc {
            outline: 3px solid var(--accent);
            outline-offset: 5px;
        }

        .poster-play {
            position: absolute;
            left: 0;
            top: 0;
            width: 79.14%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 2vw, 30px);
            gap: clamp(14px, 3cqw, 30px);
        }

        .disc {
            width: clamp(66px, 8vw, 124px);
            width: clamp(66px, 12.5cqw, 124px);
            aspect-ratio: 1;
            flex-shrink: 0;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        .disc svg {
            width: 33%;
            height: auto;
            margin-left: 7%;
        }

        .play-text {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.1cqw, 10px);
        }

        .play-label {
            font-weight: 600;
            font-size: clamp(13px, 1.4vw, 22px);
            font-size: clamp(13px, 2.16cqw, 22px);
            line-height: 1.2;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .play-duration {
            font-weight: 500;
            font-size: clamp(13px, 1.25vw, 20px);
            font-size: clamp(13px, 1.94cqw, 20px);
            line-height: 1.2;
            letter-spacing: 0.06em;
            color: #b5b5b5;
            font-variant-numeric: tabular-nums;
        }

        .poster-photo {
            position: absolute;
            left: 79.14%;
            top: 28.19%;
            width: 19.375%;
            height: 48.61%;
            border: 2px solid var(--pip-border);
            border: max(1.5px, 0.22cqw) solid var(--pip-border);
            border-radius: 13px;
            border-radius: 1.4cqw;
            overflow: hidden;
            background: #c4b1a5;
        }

        .poster-photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 30%;
        }

        @media (hover: hover) and (prefers-reduced-motion: no-preference) {
            .disc {
                transition: transform 0.25s ease;
            }

            .poster:hover .disc {
                transform: scale(1.06);
            }
        }

        /* Email */
        .contact {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .invite {
            margin: 0;
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: var(--muted);
        }

        .email-row {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .email {
            font-weight: 500;
            font-size: 22px;
            line-height: 1.3;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
        }

        .email:hover {
            color: var(--accent);
        }

        .copy {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            background: transparent;
            color: #bdbdbd;
            font: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
        }

        .copy:hover {
            border-color: rgba(255, 255, 255, 0.45);
            color: #ffffff;
        }

        .copy svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .icon-check,
        .lbl {
            display: none;
        }

        .is-copied .icon-copy {
            display: none;
        }

        .is-copied .icon-check {
            display: block;
            color: var(--accent);
        }

        .copy-status {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--accent);
            white-space: nowrap;
        }

        /* Secondary links */
        .more-links {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .more-links a {
            padding: 8px 12px;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--quiet);
            text-decoration: none;
        }

        .more-links a:hover {
            color: #ffffff;
        }

        .sep {
            width: 1px;
            height: 10px;
            background: rgba(255, 255, 255, 0.18);
        }

        /* Phones: stack from the top, full-width video, a big email row */
        @media (max-width: 599px) {
            .page {
                justify-content: flex-start;
                padding: 44px 16px 32px;
            }

            .intro-header {
                gap: 12px;
            }

            .name {
                margin-right: -0.34em;
                font-size: 18px;
                letter-spacing: 0.34em;
            }

            .role {
                margin-right: -0.22em;
                font-size: 10px;
                letter-spacing: 0.22em;
            }

            .player {
                margin-top: 28px;
                width: 100%;
                border-radius: 5px;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
            }

            .contact {
                margin-top: 32px;
                width: 100%;
            }

            .invite {
                max-width: 300px;
            }

            .email-row {
                width: 100%;
                height: 56px;
                gap: 0;
                align-items: stretch;
                border: 1px solid var(--line);
                border-radius: 10px;
                overflow: hidden;
            }

            .email {
                flex: 1;
                min-width: 0;
                display: flex;
                align-items: center;
                padding: 0 16px;
                font-size: 15px;
                border-bottom: 0;
            }

            .copy {
                width: 96px;
                height: auto;
                border: 0;
                border-left: 1px solid var(--line);
                border-radius: 0;
                color: #cfcfcf;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .copy svg {
                width: 15px;
                height: 15px;
            }

            .lbl-copy {
                display: inline;
            }

            .is-copied .lbl-copy {
                display: none;
            }

            .is-copied .lbl-copied {
                display: inline;
                color: var(--accent);
            }

            .copy-status {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            .more-links {
                margin-top: 20px;
                gap: 2px;
            }

            .more-links a {
                display: flex;
                align-items: center;
                height: 44px;
                padding: 0 14px;
            }
        }

        @media (max-width: 360px) {
            .email {
                padding: 0 12px;
                font-size: 14px;
            }

            .copy {
                width: 52px;
            }

            .lbl-copy,
            .is-copied .lbl-copied {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="intro-header">
            <h1 class="name">Matthew Bogard</h1>
            <p class="role">Senior Full Stack Engineer</p>
        </header>

        <section class="player" aria-label="Intro video">
            <video id="intro-video" preload="auto" playsinline tabindex="-1">
                <source src="/intro/assets/matthew-bogard-intro.mp4" type="video/mp4">
            </video>
            <button class="poster" id="intro-poster" type="button" aria-label="Play intro video, 1 minute 26 seconds">
                <span class="poster-play" aria-hidden="true">
                    <span class="disc">
                        <svg viewBox="0 0 24 26" aria-hidden="true">
                            <path d="M3 2.6v20.8a1.2 1.2 0 0 0 1.8 1l17.2-10.4a1.2 1.2 0 0 0 0-2L4.8 1.6A1.2 1.2 0 0 0 3 2.6z" fill="#0a0a0b" />
                        </svg>
                    </span>
                    <span class="play-text">
                        <span class="play-label">Play intro</span>
                        <span class="play-duration">1:26</span>
                    </span>
                </span>
                <span class="poster-photo" aria-hidden="true">
                    <img src="/intro/assets/headshot.jpg" alt="" width="720" height="720">
                </span>
            </button>
        </section>

        <section class="contact" aria-label="Contact">
            <p class="invite">If you'd like to talk, email me and we'll find a time for a call.</p>
            <div class="email-row" id="email-row">
                <a class="email" href="mailto:matthewkbogard@gmail.com">matthewkbogard@gmail.com</a>
                <button class="copy" id="copy-email" type="button" aria-label="Copy email address">
                    <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="12" height="12" rx="2" />
                        <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
                    </svg>
                    <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12.5l4.5 4.5L19 7.5" />
                    </svg>
                    <span class="lbl lbl-copy" aria-hidden="true">Copy</span>
                    <span class="lbl lbl-copied" aria-hidden="true">Copied</span>
                </button>
                <span class="copy-status" id="copy-status" role="status"></span>
            </div>
        </section>

        <div class="more-links">
            <a href="/portfolio/">Portfolio</a>
            <span class="sep" aria-hidden="true"></span>
            <a href="/">Drive the 3D site</a>
        </div>
    </main>

    <script>
        (function () {
            var EMAIL = 'matthewkbogard@gmail.com';

            // Click to play with sound; native controls appear once it starts
            var video = document.getElementById('intro-video');
            var poster = document.getElementById('intro-poster');

            poster.addEventListener('click', function () {
                poster.hidden = true;
                video.controls = true;
                video.focus({ preventScroll: true });
                var playing = video.play();
                if (playing && typeof playing.catch === 'function') {
                    playing.catch(function () { });
                }
            });

            // One-click copy with a brief "Copied" confirmation
            var row = document.getElementById('email-row');
            var button = document.getElementById('copy-email');
            var status = document.getElementById('copy-status');
            var timer;

            function fallbackCopy() {
                var field = document.createElement('textarea');
                field.value = EMAIL;
                field.setAttribute('readonly', '');
                field.style.position = 'fixed';
                field.style.opacity = '0';
                document.body.appendChild(field);
                field.select();
                try {
                    document.execCommand('copy');
                } catch (e) { }
                document.body.removeChild(field);
            }

            function showCopied() {
                row.classList.add('is-copied');
                status.textContent = 'Copied';
                clearTimeout(timer);
                timer = setTimeout(function () {
                    row.classList.remove('is-copied');
                    status.textContent = '';
                }, 1800);
            }

            button.addEventListener('click', function () {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(EMAIL).then(showCopied, function () {
                        fallbackCopy();
                        showCopied();
                    });
                } else {
                    fallbackCopy();
                    showCopied();
                }
            });
        })();
    </script>
</body>

</html>
