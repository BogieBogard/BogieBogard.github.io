
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MBogard.com</title>

    <!-- Favicons (matched to bogiebogard.io's MB mark) -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

    <!-- Space Grotesk for every numeral and the panel heading, Space Mono for
         uppercase system labels, Hanken Grotesk for body copy — the same three
         faces the 2D site uses. Numerals are deliberately NOT mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap">

    <!-- Critical inline CSS: the real stylesheet arrives with the app, so without
         this the page paints white with unstyled, left-justified menu text for a
         frame. This keeps a clean dark background + branded loader until ready. -->
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1424; overflow: hidden; }

        /* Hide the HUD chrome until the experience actually starts, then fade it
           in with the world (World.setReveal adds is-started). Not is-ready,
           which fires when loading finishes: that put a pause button and a
           running clock over the landing screen, where there is nothing yet to
           pause and nothing being timed. */
        body:not(.is-started) .hud-time,
        body:not(.is-started) .pause-button { opacity: 0; pointer-events: none; }
        .hud-time, .pause-button { transition: opacity 0.5s ease 0.15s; }

        /* Full-screen loader shown over everything until the scene is ready. */
        #app-loading {
            position: fixed; inset: 0; z-index: 100; background: #0b1424;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        /* The spinner positions itself against its nearest positioned ancestor,
           so it gets a box of its own rather than centring on the viewport --
           that is what lets the label sit under it instead of on top of it.
           44px is the spinner proper; its outer ring is 49px and overflows by
           2.5px a side, which the gap below absorbs. */
        .app-loading__inner {
            display: flex; flex-direction: column; align-items: center; gap: 26px;
        }
        .app-loading__spinner { position: relative; width: 44px; height: 44px; }
        /* Space Mono, tracked and uppercase: the same treatment every system
           label on the site gets (see .pause-label). Cyan is the spinner's own
           accent, so the two read as one object. */
        .app-loading__label {
            margin: 0;
            font-family: 'Space Mono', ui-monospace, monospace;
            font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
            color: #38bdf8;
        }
        /* All three dots are always in the line and only their opacity moves, so
           nothing reflows as they light up. The first is lit throughout: the
           count is cumulative -- one, two, three -- and the drop back to one is
           the reset. */
        .app-loading__dots span { opacity: 0.18; }
        .app-loading__dots span:nth-child(1) { opacity: 1; }
        /* One ellipsis per inner-ring revolution: the ring turns in 1150ms and
           the three dots dial up in thirds of that, 383ms a beat, so the count
           restarts on the same frame the ring closes its circle. The outer ring
           (2300ms) therefore gets exactly two cycles per turn. Change one of
           these numbers and the other two have to follow. */
        .app-loading__dots span:nth-child(2) { animation: loading-dot-2 1150ms linear infinite; }
        .app-loading__dots span:nth-child(3) { animation: loading-dot-3 1150ms linear infinite; }
        @keyframes loading-dot-2 {
            0%, 33.33% { opacity: 0.18; }
            38%, 100%  { opacity: 1; }
        }
        @keyframes loading-dot-3 {
            0%, 66.66% { opacity: 0.18; }
            71.33%, 100% { opacity: 1; }
        }
        /* Nothing here carries meaning that the static text does not, so when
           motion is unwelcome the dots simply sit there lit. */
        @media (prefers-reduced-motion: reduce) {
            .app-loading__dots span { animation: none; opacity: 1; }
        }
        /* Whirlpool spinner — shared with the 2D portfolio (/portfolio/) for a
           consistent loading motif, recolored for the dark background here
           (light rings + cyan accent instead of the 2D site's black-on-white). */
        .cssload-whirlpool,
        .cssload-whirlpool::before,
        .cssload-whirlpool::after {
            position: absolute; top: 50%; left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left-color: #38bdf8;
            border-radius: 874px;
        }
        .cssload-whirlpool {
            margin: -22px 0 0 -22px; height: 44px; width: 44px;
            animation: cssload-rotate 1150ms linear infinite;
        }
        .cssload-whirlpool::before {
            content: ""; margin: -20px 0 0 -20px; height: 38px; width: 38px;
            animation: cssload-rotate 1150ms linear infinite;
        }
        .cssload-whirlpool::after {
            content: ""; margin: -25px 0 0 -25px; height: 49px; width: 49px;
            animation: cssload-rotate 2300ms linear infinite;
        }
        @keyframes cssload-rotate { 100% { transform: rotate(360deg); } }
        body.is-ready #app-loading { opacity: 0; pointer-events: none; }
    </style>

    <!-- Shared ambient-music player (also included by /portfolio/) so the
         background track carries across between the game and the 2D site. -->
    <script src="/ambient.js" defer></script>

  <script type="module" crossorigin src="/assets/index-CXbHY1Ip.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-M21tCkrR.css">
</head>
<body>

    <!-- The label says what the wait is for. A recruiter landing here has no way
         to know a blank dark screen is fetching a 3D world rather than failing,
         and three seconds of unexplained spinner is where people leave. The dots
         are decoration on top of that sentence, so they are hidden from screen
         readers rather than read out as changing text. -->
    <div id="app-loading" role="status" aria-live="polite">
        <div class="app-loading__inner">
            <div class="app-loading__spinner"><div class="cssload-whirlpool"></div></div>
            <p class="app-loading__label">Loading 3D assets<span class="app-loading__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
        </div>
    </div>

    <canvas class="canvas js-canvas"></canvas>

    <!-- HUD. One shape on every device: the run time as bare text over the world,
         and one pause button holding every setting. The settings gear, its panel,
         the chase-timer panel and the 2D-site link all folded into this. -->
    <div class="hud-time js-hud-time">
        <div class="hud-time__row">
            <span class="hud-time__current js-hud-current">0.0s</span>
            <span class="hud-time__best js-hud-best">BEST 0.0s</span>
        </div>
        <div class="hud-time__notice js-hud-notice"></div>
    </div>

    <button class="pause-button js-pause-button" type="button" aria-label="Pause" title="Pause (Esc)">
        <span class="pause-button__bar"></span>
        <span class="pause-button__bar"></span>
    </button>

    <div class="pause js-pause" aria-hidden="true">
        <div class="pause__scrim js-pause-scrim"></div>
        <div class="pause-panel js-pause-panel" role="dialog" aria-modal="true" aria-label="Paused">
            <div class="pause-panel__header">
                <span class="pause-panel__title">Paused</span>
                <span class="pause-panel__time js-pause-time">0.0s &middot; BEST 0.0s</span>
            </div>
            <div class="pause-panel__body">
                <div class="pause-col pause-col--theme">
                    <section class="pause-section">
                        <div class="pause-label">Theme</div>
                        <!-- Swatches are built from the live theme table so rift
                             palettes earned at runtime appear here too. -->
                        <div class="pause-swatches js-pause-themes"></div>
                        <div class="pause-current js-pause-theme-name"></div>
                    </section>
                </div>
                <div class="pause-col pause-col--vehicle">
                    <!-- Both of these need the car, which only exists once the
                         experience starts; PauseMenu unhides them then. -->
                    <section class="pause-section js-pause-vehicle-section" hidden>
                        <div class="pause-label">Vehicle</div>
                        <div class="pause-chips js-pause-vehicles"></div>
                        <div class="pause-credit js-pause-vehicle-credit"></div>
                    </section>
                    <section class="pause-section js-pause-speed-section" hidden>
                        <div class="pause-row">
                            <span class="pause-label">Car Speed</span>
                            <span class="pause-value js-pause-speed-value">1.00&times;</span>
                        </div>
                        <div class="pause-slider">
                            <div class="pause-slider__track">
                                <div class="pause-slider__fill js-pause-speed-fill"></div>
                            </div>
                            <input class="pause-slider__input js-pause-speed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Car speed">
                        </div>
                    </section>
                </div>
                <div class="pause-col pause-col--toggles">
                    <section class="pause-section">
                        <div class="pause-row">
                            <span class="pause-label">Chase</span>
                            <div class="pause-toggle js-pause-chase">
                                <button class="pause-toggle__button" type="button" data-value="on">On</button>
                                <button class="pause-toggle__button" type="button" data-value="off">Off</button>
                            </div>
                        </div>
                        <div class="pause-row">
                            <span class="pause-label">Music</span>
                            <div class="pause-toggle js-pause-music">
                                <button class="pause-toggle__button" type="button" data-value="on">On</button>
                                <button class="pause-toggle__button" type="button" data-value="off">Off</button>
                            </div>
                        </div>
                        <div class="pause-credit">
                            &ldquo;Warm Spot&rdquo; &middot; Bosnow &middot; Music from Uppbeat
                        </div>
                    </section>
                </div>
                <div class="pause-panel__footer">
                    <!-- Portrait stacks every section into one column, so most of
                         the panel is below the fold with nothing saying so. This is
                         the affordance: a chevron riding the fade at the foot of
                         the scroller, shown only while there is more to reach.
                         Decorative — the sections it points at are reachable by
                         scroll, Tab and screen reader without it. -->
                    <div class="pause-scroll-hint js-pause-scroll-hint" aria-hidden="true">
                        <svg viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 8 8l6.5-6.5"/></svg>
                    </div>
                    <button class="pause-resume js-pause-resume" type="button">Resume</button>
                    <a class="pause-2d" href="/portfolio/">View 2D site &#8599;</a>
                    <div class="pause-version js-build-version"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Rift chrome. Each rift builds its own HUD panel into the body; these are
         the pieces every world shares. -->
    <div class="rift-prompt js-rift-prompt">Drive through the rift</div>
    <div class="rift-banner js-rift-banner"></div>
    <div class="rift-flash js-rift-flash"></div>
    <div class="rift-danger js-rift-danger"></div>

    </div>

</body>
</html>
